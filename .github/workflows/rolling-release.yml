# gemeinstrom-Fork-Variante des upstream-Workflows (eegfaktura/*).
# Delta zum Upstream (bei jedem Upstream-Sync neu anwenden):
#   - Push nach ghcr.io/gemeinstrom/* statt ghcr.io/vfeeg-development/*
#   - Registry-Login mit GITHUB_TOKEN statt VFEEG_DEV_PUSH_PAT (same-org push)
#   - dispatch-*-Jobs zum Platform-Repo in vfeeg-development entfernt, kein env/**-Trigger
# Die Kommentare unterhalb stammen aus dem Upstream und beschreiben dessen Ziel-Org.

# Stage 1 (build-only) fuer eegfaktura-master — das prod-Backend
# (go.mod-Modul at.ourproject/vfeeg-backend, Binary `vfeeg-backend`).
#
# Baut den selbst-enthaltenen Dockerfile (Go 1.26 + protoc + go generate).
# PR-Events bauen nur (kein Push, fork-sicher); Push auf den Default-Branch
# baut + pusht nach ghcr.io/<repo>.
#
# Bewusst NICHT dabei (spaetere Stufen):
#   - dispatch-deploy zum Platform-Repo (Stage 3)
#   - Push ins Development-Tier vfeeg-development/vfeeg-backend (Migration,
#     braucht VFEEG_DEV_PUSH_PAT + Naming-Mapping wie bei eda-xp/kep)

name: Docker Image CI

on:
  push:
    branches:
      - master
      - main
      - 'preview/**'
    tags:
      - v*
    # a commit that only changes the CHANGELOG (release PR) builds no image; the release promotes the image of the
    # commit before (platform#239). Tag pushes still build: path filters do not apply to tags.
    paths-ignore: ['CHANGELOG.md']
  # ready_for_review: a draft gets no image build; it runs once the PR is marked ready
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
      - main
    # a pull request that only changes the CHANGELOG (release PR) builds no image either (platform#239)
    paths-ignore: ['CHANGELOG.md']

env:
  REGISTRY: "ghcr.io"
  # Development-Tier (ADR-0005): Push nach vfeeg-development. Image-Name
  # `vfeeg-backend` = prod-/dev-Image-Name (das Binary heisst auch so),
  # NICHT der Repo-Name eegfaktura-master.
  IMAGE_NAME: gemeinstrom/${{ github.event.repository.name }}

jobs:
  build-and-push-image:
    # pull requests: not while a draft (pr-checks.yml tests drafts)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title="eegfaktura-backend"
            org.opencontainers.image.description="VFEEG Master Backend (vfeeg-backend) — EDA/MQTT, GraphQL, billing master data"
            org.opencontainers.image.source=${{ github.event.repository.html_url || '' }}
            org.opencontainers.image.url=${{ github.event.repository.html_url || '' }}
            org.opencontainers.image.version=${{ github.sha || '' }}
            org.opencontainers.image.revision=${{ github.sha || '' }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || '' }}
            org.opencontainers.image.authors="eegfaktura@vfeeg.org"
            org.opencontainers.image.vendor="Verein zur Förderung von Erneuerbaren Energiegemeinschaften"
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id || '' }}
            org.opencontainers.image.revision.sha=${{ github.sha || '' }}
            org.opencontainers.image.repository=${{ github.repository || '' }}
            org.opencontainers.image.repository.url=${{ github.event.repository.html_url || '' }}

      - name: Login to Container Registry
        # Nur bei push-Events anmelden — PRs (auch aus Forks) duerfen nicht pushen.
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Cross-Org-Push nach vfeeg-development — GITHUB_TOKEN reicht nicht.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR) / Build and push (push)
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags || 'latest' }}
          labels: ${{ steps.meta.outputs.labels || '' }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # service.version in the log identifies the BUILD: the version for a tag build, else the commit (a branch
          # name cannot tell builds apart). Prod/pilot images are re-tagged dev-tier digests (gitops promote-image.yml,
          # no rebuild), so the release version of a running image is its tag, not this value.
          build-args: |
            SERVICE_VERSION=${{ github.ref_type == 'tag' && steps.meta.outputs.version || github.sha }}

      - name: Generate artifact attestation
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
